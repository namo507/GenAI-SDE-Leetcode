name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, content, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run validate
      - run: npm run build

  fixtures:
    name: Paired Python and R outputs, tests and drills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the Python packages lessons import (allowlisted in the browser too)
        run: python -m pip install "pandas>=2.2" "numpy>=2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install testthat
        run: Rscript -e 'install.packages("testthat")'
      - run: npm ci
      - run: npm run fixtures

  e2e:
    name: Accessibility, viewports and interactions (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - name: Browser runtimes (downloads Pyodide and webR from their CDNs)
        run: npx playwright test tests/e2e/runtime.spec.ts
        env:
          RUNTIME_E2E: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
